name: Build Group 2 Windows executable

on:
  push:
    branches:
      - build/windows-exe-20260930
  workflow_dispatch:

jobs:
  windows-executable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run source tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build executable on Windows
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --clean --noconfirm --onefile --name group-2-splc --paths src src/spl_frontend/__main__.py

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path smoke | Out-Null
          Copy-Item dist/group-2-splc.exe smoke/
          Set-Location smoke
          [System.IO.File]::WriteAllText((Join-Path (Get-Location).Path 'SPL.txt'), ': : ', [System.Text.Encoding]::ASCII)
          & .\group-2-splc.exe
          if ($LASTEXITCODE -ne 0 -or !(Test-Path tree.xml)) {
            throw 'Valid SPL input did not produce tree.xml.'
          }
          [System.IO.File]::WriteAllText((Join-Path (Get-Location).Path 'SPL.txt'), ': :', [System.Text.Encoding]::ASCII)
          & .\group-2-splc.exe
          if ($LASTEXITCODE -eq 0 -or (Test-Path tree.xml)) {
            throw 'Invalid SPL input was accepted or left a stale tree.xml.'
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: group-2-windows-exe
          path: dist/group-2-splc.exe
          if-no-files-found: error
          compression-level: 0
