name: P2 compiler source and target execution tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require a target C++ compiler for execution checks
        run: python -c "import shutil; assert any(shutil.which(x) for x in ('c++', 'g++', 'clang++')), 'C++ compiler required for target execution tests'"
      - name: Run source, semantic and executable-target tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src tests tools
      - name: Check source CLI as a subprocess
        env:
          PYTHONPATH: src
        run: python tools/black_box_test.py
      - name: Retain actionable failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-failures-${{ matrix.os }}
          path: build/*-failures/
          if-no-files-found: ignore
          retention-days: 7
